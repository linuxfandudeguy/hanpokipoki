---
layout: default
title: Chinese Dictionary Chunks
---

<h2>Click a file below to download it:</h2>

<ul>
  {% assign files = site.static_files %}
  {% for file in files %}
    {% if file.path contains 'dictionary/' %}
      <li><a href="{{ file.path | relative_url }}" download>{{ file.name }}</a></li>
    {% endif %}
  {% endfor %}
</ul>
